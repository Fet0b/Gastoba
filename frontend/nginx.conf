server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/cabecalhos-de-seguranca.conf;

    # A API fica atrás de /api/ (o prefixo é removido): a SPA e a API são do mesmo site.
    # O Host original segue adiante, porque a API só atende os hosts de GASTOBA_HOSTS_PERMITIDOS.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        include /etc/nginx/cabecalhos-de-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/cabecalhos-de-seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
