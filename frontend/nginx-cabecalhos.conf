# Cabeçalhos de segurança de toda resposta. O nginx não herda add_header para um bloco que
# declara os seus; por isso este arquivo é incluído no server e em cada location com add_header.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
